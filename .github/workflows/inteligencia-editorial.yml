name: GachaVerse Editorial Intelligence

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inteligencia-editorial
  cancel-in-progress: false

jobs:
  fontes-publicas:
    if: github.repository == 'hrq1408/gachaverse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - name: Auditar as fontes públicas
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          set -o pipefail
          pnpm exec tsx scripts/editorial-intelligence.ts --public | tee -a "$GITHUB_STEP_SUMMARY"

  relatorios-privados:
    if: github.event.repository.private == true && github.repository == 'hrq1408/gachaverse-intelligence' && github.repository_id == '1473633500' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Confirmar identidade, visibilidade e configuração
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ vars.GACHAVERSE_SOURCE_SHA }}
          GSC_PROVIDER: ${{ vars.GSC_WIF_PROVIDER }}
          GSC_ACCOUNT: ${{ vars.GSC_SERVICE_ACCOUNT }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '(.id | tostring) + ":" + .visibility + ":" + .default_branch')" = '1473633500:private:main'
          test "$GITHUB_WORKFLOW_REF" = 'hrq1408/gachaverse-intelligence/.github/workflows/inteligencia-editorial.yml@refs/heads/main'
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || -z "$GSC_PROVIDER" || -z "$GSC_ACCOUNT" ]]; then
            echo 'Configure GACHAVERSE_SOURCE_SHA, GSC_WIF_PROVIDER e GSC_SERVICE_ACCOUNT no repositório privado.'
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: hrq1408/gachaverse
          ref: ${{ vars.GACHAVERSE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - name: Emitir token temporário com escopo de leitura
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GSC_WIF_PROVIDER }}
          service_account: ${{ vars.GSC_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Gerar relatórios fora da cópia de trabalho
        env:
          GSC_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GACHAVERSE_PRIVATE_WORKFLOW: 'true'
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          test -n "$GSC_ACCESS_TOKEN"
          mkdir -m 700 "$RUNNER_TEMP/inteligencia"
          pnpm exec tsx scripts/editorial-intelligence.ts --out "$RUNNER_TEMP/inteligencia"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gachaverse-inteligencia-editorial
          path: ${{ runner.temp }}/inteligencia/
          if-no-files-found: error
          retention-days: 7
